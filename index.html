<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#5aa9c9">
<title>English for Secretaries – Vocabulary Learning App</title>
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eef6fa;
  --surface:#ffffff;
  --surface-2:#f7fbfd;
  --primary:#5aa9c9;
  --primary-d:#3f8dab;
  --primary-l:#e7f4f9;
  --primary-xl:#f2fafd;
  --ink:#20343d;
  --ink-2:#54707f;
  --muted:#8ba6b4;
  --line:#e3eef4;
  --line-2:#eef5f9;
  --green:#3fa382;
  --green-l:#e6f6f0;
  --red:#dd7a72;
  --red-l:#fdeeec;
  --amber:#dda63f;
  --amber-l:#fdf4e3;
  --radius:16px;
  --radius-s:10px;
  --shadow:0 4px 18px rgba(60,110,135,.08);
  --shadow-s:0 1px 6px rgba(60,110,135,.07);
  --sidebar-w:252px;
}
html,body{height:100%}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--ink);
  -webkit-font-smoothing:antialiased;
  font-size:15px;line-height:1.55;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--primary-d)}

/* ============================================================
   LAYOUT
   ============================================================ */
#app{display:flex;min-height:100vh}

#sidebar{
  width:var(--sidebar-w);background:var(--surface);
  border-right:1px solid var(--line);
  position:fixed;top:0;bottom:0;left:0;z-index:80;
  display:flex;flex-direction:column;
  transition:transform .25s ease;
  overflow-y:auto;
}
.sb-brand{
  padding:20px 18px 16px;border-bottom:1px solid var(--line-2);
}
.sb-brand h1{font-size:16px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.sb-brand span{display:block;font-size:11.5px;color:var(--muted);font-weight:500;margin-top:3px;letter-spacing:.3px}
.sb-logo{
  width:38px;height:38px;border-radius:11px;
  background:linear-gradient(135deg,var(--primary),#7cc4de);
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:700;font-size:15px;margin-bottom:11px;
  box-shadow:0 4px 12px rgba(90,169,201,.32);
}
.sb-nav{padding:12px 10px;flex:1}
.sb-item{
  display:flex;align-items:center;gap:11px;
  width:100%;padding:10px 12px;border-radius:var(--radius-s);
  color:var(--ink-2);font-weight:500;font-size:14px;
  text-align:left;transition:background .15s,color .15s;
  margin-bottom:2px;
}
.sb-item .ico{width:20px;text-align:center;font-size:15px;flex:none}
.sb-item:hover{background:var(--primary-xl);color:var(--primary-d)}
.sb-item.active{background:var(--primary-l);color:var(--primary-d);font-weight:600}
.sb-foot{padding:12px 16px 18px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted)}

#main{
  margin-left:var(--sidebar-w);flex:1;min-width:0;
  display:flex;flex-direction:column;
}

#topbar{
  height:60px;background:rgba(255,255,255,.86);
  backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;
  padding:0 20px;position:sticky;top:0;z-index:50;
}
#hamburger{
  display:none;width:38px;height:38px;border-radius:10px;
  align-items:center;justify-content:center;font-size:19px;
  color:var(--ink-2);background:var(--surface-2);
}
.tb-title{font-size:16px;font-weight:600;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-chip{
  font-size:11.5px;font-weight:600;color:var(--primary-d);
  background:var(--primary-l);padding:5px 11px;border-radius:20px;
  white-space:nowrap;
}

#view{padding:24px;max-width:1180px;width:100%;margin:0 auto;flex:1}

#overlay{
  position:fixed;inset:0;background:rgba(30,60,75,.38);
  z-index:70;opacity:0;pointer-events:none;transition:opacity .25s;
}
#overlay.show{opacity:1;pointer-events:auto}

/* ============================================================
   COMMON COMPONENTS
   ============================================================ */
.card{
  background:var(--surface);border-radius:var(--radius);
  box-shadow:var(--shadow);border:1px solid var(--line-2);
  padding:20px;
}
.page-head{margin-bottom:20px}
.page-head h2{font-size:22px;font-weight:700;letter-spacing:-.3px}
.page-head p{color:var(--ink-2);font-size:13.5px;margin-top:4px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 17px;border-radius:11px;font-weight:600;font-size:14px;
  background:var(--primary);color:#fff;
  transition:transform .1s,box-shadow .18s,background .18s;
  box-shadow:0 3px 10px rgba(90,169,201,.26);
  white-space:nowrap;
}
.btn:hover{background:var(--primary-d);box-shadow:0 5px 15px rgba(90,169,201,.32)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--surface);color:var(--ink-2);border:1px solid var(--line);box-shadow:none}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink);border-color:#d3e5ee}
.btn.soft{background:var(--primary-l);color:var(--primary-d);box-shadow:none}
.btn.soft:hover{background:#d9edf6}
.btn.green{background:var(--green);box-shadow:0 3px 10px rgba(63,163,130,.26)}
.btn.green:hover{background:#359073}
.btn.amber{background:var(--amber);box-shadow:0 3px 10px rgba(221,166,63,.26)}
.btn.amber:hover{background:#c9922f}
.btn.red{background:var(--red);box-shadow:0 3px 10px rgba(221,122,114,.26)}
.btn.red:hover{background:#cd675f}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:9px}
.btn.block{width:100%}

.grid{display:grid;gap:14px}
.g-4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-auto{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}

.stat{
  background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow-s);
}
.stat .lbl{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.2px;text-transform:uppercase}
.stat .val{font-size:26px;font-weight:700;margin-top:5px;letter-spacing:-.6px}
.stat .sub{font-size:12px;color:var(--muted);margin-top:2px}
.stat.accent{background:linear-gradient(135deg,var(--primary),#79c3dd);border:none;color:#fff}
.stat.accent .lbl,.stat.accent .sub{color:rgba(255,255,255,.85)}
.stat.accent .val{color:#fff}

.bar{height:8px;background:#e9f1f5;border-radius:20px;overflow:hidden}
.bar > i{display:block;height:100%;border-radius:20px;background:var(--primary);transition:width .4s ease}
.bar.green > i{background:var(--green)}
.bar.amber > i{background:var(--amber)}
.bar.red > i{background:var(--red)}

.pill{
  display:inline-flex;align-items:center;gap:5px;
  font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:20px;
  background:var(--primary-l);color:var(--primary-d);
}
.pill.gray{background:#f0f5f8;color:var(--muted)}
.pill.green{background:var(--green-l);color:#2f7d63}
.pill.amber{background:var(--amber-l);color:#a97b21}
.pill.red{background:var(--red-l);color:#b8564e}

.field{
  width:100%;padding:10px 13px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);outline:none;
  transition:border-color .15s,box-shadow .15s;
}
.field:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(90,169,201,.13)}

.tabs{display:flex;gap:7px;flex-wrap:wrap}
.tab{
  padding:7px 14px;border-radius:20px;font-size:13px;font-weight:600;
  background:var(--surface);border:1px solid var(--line);color:var(--ink-2);
  transition:all .15s;
}
.tab:hover{border-color:#cfe4ee;color:var(--primary-d)}
.tab.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 3px 10px rgba(90,169,201,.25)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.toolbar .field{max-width:280px}
select.field{max-width:190px;cursor:pointer}

.empty{
  text-align:center;padding:48px 20px;color:var(--muted);
}
.empty .big{font-size:34px;margin-bottom:10px;opacity:.6}

/* ============================================================
   VOCABULARY CARDS
   ============================================================ */
.vcard{
  background:var(--surface);border:1px solid var(--line-2);
  border-radius:var(--radius);padding:17px 18px;box-shadow:var(--shadow-s);
  transition:box-shadow .18s,transform .18s,border-color .18s;
}
.vcard:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.vcard.learned{border-left:4px solid var(--green)}
.vcard.difficult{border-left:4px solid var(--amber)}
.vcard.learning{border-left:4px solid var(--primary)}
.vc-top{display:flex;align-items:flex-start;gap:10px;flex-wrap:wrap}
.vc-word{font-size:17.5px;font-weight:700;letter-spacing:-.2px}
.vc-pos{font-size:12px;color:var(--muted);font-style:italic}
.vc-ipa{font-size:13px;color:var(--primary-d);font-family:"Segoe UI",Arial,sans-serif}
.vc-vi{font-size:14.5px;font-weight:600;color:var(--ink);margin-top:9px}
.vc-ex{
  margin-top:11px;padding:11px 13px;background:var(--surface-2);
  border-radius:11px;border-left:3px solid var(--primary-l);
  font-size:13.5px;color:var(--ink-2);line-height:1.5;
}
.vc-ex b{color:var(--ink);font-weight:600}
.vc-ex .vi{color:var(--muted);font-style:italic;display:block;margin-top:4px}
.vc-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px;align-items:center}
.icon-btn{
  width:34px;height:34px;border-radius:10px;display:inline-flex;
  align-items:center;justify-content:center;font-size:15px;
  background:var(--primary-l);color:var(--primary-d);flex:none;
  transition:background .15s,transform .1s;
}
.icon-btn:hover{background:#d6ecf6}
.icon-btn:active{transform:scale(.94)}
.icon-btn.playing{background:var(--primary);color:#fff;animation:pulse 1s infinite}
.icon-btn.on-green{background:var(--green-l);color:#2f7d63}
.icon-btn.on-amber{background:var(--amber-l);color:#a97b21}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* ============================================================
   FLASHCARDS
   ============================================================ */
.fc-stage{max-width:760px;margin:0 auto}
.fc-wrap{perspective:1400px;margin-bottom:18px}
.fc{
  position:relative;width:100%;min-height:400px;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1);
  cursor:pointer;
}
.fc.no-anim{transition:none}
.fc.flipped{transform:rotateY(180deg)}
.fc-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--surface);border:1px solid var(--line-2);border-radius:20px;
  box-shadow:var(--shadow);padding:30px 26px;
  display:flex;flex-direction:column;overflow:auto;
}
.fc-back{transform:rotateY(180deg);background:linear-gradient(160deg,#ffffff,#f6fbfd)}
.fc-badge{
  position:absolute;top:16px;left:20px;font-size:11px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;color:var(--muted);
}
.fc-center{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;gap:10px;padding:18px 0;
}
.fc-word{font-size:clamp(24px,5vw,38px);font-weight:700;letter-spacing:-.8px;line-height:1.15}
.fc-ipa{font-size:16px;color:var(--primary-d)}
.fc-pos{font-size:13.5px;color:var(--muted);font-style:italic}
.fc-hint{font-size:12px;color:var(--muted);margin-top:6px}
.fc-vi{font-size:clamp(19px,3.6vw,26px);font-weight:700;letter-spacing:-.3px}
.fc-ex{
  background:var(--primary-xl);border-radius:13px;padding:15px 16px;
  font-size:14.5px;line-height:1.6;text-align:left;width:100%;
}
.fc-ex .vi{display:block;color:var(--ink-2);font-style:italic;margin-top:6px;font-size:13.5px}
.fc-controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.fc-progress{max-width:760px;margin:0 auto 14px}
.fc-progress .row{display:flex;justify-content:space-between;font-size:12.5px;color:var(--ink-2);margin-bottom:6px;font-weight:600}

.mode-card{
  background:var(--surface);border:1px solid var(--line-2);border-radius:var(--radius);
  padding:18px;box-shadow:var(--shadow-s);cursor:pointer;text-align:left;
  transition:all .18s;display:flex;gap:13px;align-items:flex-start;
}
.mode-card:hover{border-color:#cbe4ef;transform:translateY(-2px);box-shadow:var(--shadow)}
.mode-card .mi{
  width:42px;height:42px;border-radius:12px;background:var(--primary-l);
  display:flex;align-items:center;justify-content:center;font-size:19px;flex:none;
}
.mode-card h4{font-size:15px;font-weight:650;margin-bottom:3px}
.mode-card p{font-size:12.5px;color:var(--muted);line-height:1.45}

/* ============================================================
   QUESTIONS
   ============================================================ */
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.q-num{font-size:13px;font-weight:700;color:var(--primary-d);letter-spacing:.3px}
.q-text{font-size:17px;font-weight:600;line-height:1.55;margin-bottom:16px}
.q-text u{text-decoration:none;border-bottom:2px solid var(--primary);padding:0 22px}

.opt{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;
  background:var(--surface);margin-bottom:9px;font-size:14.5px;
  transition:all .15s;line-height:1.45;
}
.opt:hover:not(.locked){border-color:#bfdceb;background:var(--primary-xl)}
.opt .key{
  width:27px;height:27px;border-radius:8px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:12.5px;color:var(--ink-2);flex:none;
  border:1px solid var(--line);
}
.opt.selected{border-color:var(--primary);background:var(--primary-l)}
.opt.selected .key{background:var(--primary);color:#fff;border-color:var(--primary)}
.opt.correct{border-color:var(--green);background:var(--green-l)}
.opt.correct .key{background:var(--green);color:#fff;border-color:var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-l)}
.opt.wrong .key{background:var(--red);color:#fff;border-color:var(--red)}
.opt.locked{cursor:default}

.explain{
  margin-top:14px;padding:15px 16px;border-radius:13px;font-size:13.8px;line-height:1.62;
  background:var(--primary-xl);border-left:4px solid var(--primary);
}
.explain.good{background:var(--green-l);border-left-color:var(--green)}
.explain.bad{background:var(--red-l);border-left-color:var(--red)}
.explain h5{font-size:13px;font-weight:700;margin-bottom:6px;letter-spacing:.2px}
.explain .vi{color:var(--ink-2);margin-top:7px;font-size:13.2px}

/* Reorder */
.pool,.answer-area{
  min-height:64px;border-radius:13px;padding:11px;
  display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;
  border:1.5px dashed var(--line);background:var(--surface-2);
}
.answer-area{border-style:solid;border-color:#cfe6f1;background:var(--primary-xl);margin-bottom:12px}
.chip{
  padding:9px 14px;border-radius:10px;background:var(--surface);
  border:1.5px solid var(--line);font-size:14px;font-weight:600;
  box-shadow:var(--shadow-s);transition:all .14s;cursor:pointer;
  user-select:none;
}
.chip:hover{border-color:var(--primary);color:var(--primary-d);transform:translateY(-1px)}
.chip.in-answer{background:var(--primary);color:#fff;border-color:var(--primary)}
.chip.in-answer:hover{background:var(--primary-d)}
.chip.locked{cursor:default;opacity:.95}
.chip.correct{background:var(--green)!important;border-color:var(--green)!important;color:#fff!important}
.chip.wrong{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.reorder-label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:7px}

/* ============================================================
   MISC
   ============================================================ */
.unit-row{
  display:flex;align-items:center;gap:14px;padding:14px 16px;
  border:1px solid var(--line-2);border-radius:var(--radius);
  background:var(--surface);margin-bottom:10px;box-shadow:var(--shadow-s);
  flex-wrap:wrap;
}
.unit-num{
  width:44px;height:44px;border-radius:13px;background:var(--primary-l);
  color:var(--primary-d);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:14px;flex:none;
}
.unit-info{flex:1;min-width:180px}
.unit-info h4{font-size:14.5px;font-weight:650}
.unit-info p{font-size:12.5px;color:var(--muted);margin-top:2px}

.list-row{
  display:flex;align-items:center;gap:12px;padding:12px 14px;
  border-bottom:1px solid var(--line-2);font-size:13.5px;flex-wrap:wrap;
}
.list-row:last-child{border-bottom:none}
.list-row .grow{flex:1;min-width:140px}

.setting-row{
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  padding:14px 0;border-bottom:1px solid var(--line-2);flex-wrap:wrap;
}
.setting-row:last-child{border-bottom:none}
.setting-row .txt{flex:1;min-width:180px}
.setting-row .txt b{font-size:14px;font-weight:600;display:block}
.setting-row .txt span{font-size:12.5px;color:var(--muted)}

.switch{position:relative;width:48px;height:27px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.slider{
  position:absolute;inset:0;background:#d5e3ea;border-radius:30px;
  transition:.22s;cursor:pointer;
}
.slider:before{
  content:"";position:absolute;width:21px;height:21px;left:3px;top:3px;
  background:#fff;border-radius:50%;transition:.22s;
  box-shadow:0 1px 4px rgba(0,0,0,.18);
}
.switch input:checked + .slider{background:var(--primary)}
.switch input:checked + .slider:before{transform:translateX(21px)}

#toast{
  position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);
  background:#22383f;color:#fff;padding:12px 22px;border-radius:12px;
  font-size:13.5px;font-weight:500;z-index:200;opacity:0;
  transition:all .3s ease;pointer-events:none;max-width:90vw;text-align:center;
  box-shadow:0 8px 24px rgba(0,0,0,.22);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.modal-bg{
  position:fixed;inset:0;background:rgba(28,58,72,.45);z-index:150;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
  background:#fff;border-radius:18px;padding:24px;max-width:440px;width:100%;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}
.modal h3{font-size:17px;margin-bottom:9px}
.modal p{font-size:14px;color:var(--ink-2);margin-bottom:18px;line-height:1.55}
.modal .row{display:flex;gap:9px;justify-content:flex-end;flex-wrap:wrap}

.result-hero{
  text-align:center;padding:30px 20px;
  background:linear-gradient(135deg,var(--primary),#7cc4de);
  border-radius:var(--radius);color:#fff;margin-bottom:18px;
}
.result-hero .score{font-size:46px;font-weight:700;letter-spacing:-1.6px;line-height:1}
.result-hero .sub{font-size:14px;opacity:.9;margin-top:7px}

.note{
  font-size:12.5px;color:var(--ink-2);background:var(--primary-xl);
  border-radius:11px;padding:12px 14px;line-height:1.6;border-left:3px solid var(--primary);
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width:1024px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  #sidebar{transform:translateX(-100%);box-shadow:0 0 40px rgba(0,0,0,.14)}
  #sidebar.open{transform:translateX(0)}
  #main{margin-left:0}
  #hamburger{display:flex}
  #view{padding:16px}
  .g-3,.g-2{grid-template-columns:1fr}
  .fc{min-height:430px}
  .fc-face{padding:24px 18px}
  .btn{padding:11px 16px}
}
@media (max-width:560px){
  .g-4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat .val{font-size:21px}
  .page-head h2{font-size:19px}
  .fc-controls .btn{flex:1 1 auto}
  .fc{min-height:470px}
  .toolbar .field,select.field{max-width:100%;width:100%}
}
@media (max-width:400px){

mcq(1,"A",1,"The company needs to buy some ______ for the new employees, including pens, folders, and paperclips.",
 ["office furniture","office supplies","office documents","office equipment"],"B",
 "“Office supplies” = văn phòng phẩm (bút, bìa kẹp, kẹp giấy…). “Office furniture” là nội thất, “office documents” là tài liệu, “office equipment” là thiết bị.",
 "Công ty cần mua một ít văn phòng phẩm cho nhân viên mới, bao gồm bút, bìa kẹp và kẹp giấy.");

mcq(2,"A",1,"Please use a ______ to attach these two pages together.",
 ["paperclip","folder","staple","receipt"],"C",
 "“Staple” = ghim bấm giấy, dùng để ghim các trang giấy lại với nhau. “Paperclip” chỉ kẹp giấy (không đục lỗ).",
 "Vui lòng dùng một chiếc ghim bấm để ghim hai trang này lại với nhau.");

mcq(3,"A",1,"The secretary put the important documents in a blue ______.",
 ["folder","shelf","coat rack","stapler"],"A",
 "“Folder” = bìa kẹp tài liệu. Câu nói về việc đặt tài liệu vào bìa kẹp màu xanh.",
 "Thư ký đặt những tài liệu quan trọng vào một bìa kẹp màu xanh.");

mcq(4,"A",1,"Ms. Hoa is ______ ordering office supplies for the entire department.",
 ["familiar with","in charge of","interested in","looking for"],"B",
 "“In charge of” = chịu trách nhiệm, đảm nhận một công việc.",
 "Cô Hoa chịu trách nhiệm đặt mua văn phòng phẩm cho toàn bộ phòng ban.");

mcq(5,"A",1,"The company placed an ______ for 200 pens and 100 notebooks.",
 ["introduction","order","receipt","vacancy"],"B",
 "Cụm cố định “place an order for + số lượng” = đặt một đơn hàng.",
 "Công ty đã đặt một đơn hàng gồm 200 cây bút và 100 quyển vở.");

mcq(6,"A",2,"You can hang your coat on the ______ near the entrance.",
 ["filing cabinet","office desk","coat rack","reception desk"],"C",
 "“Coat rack” = giá treo áo khoác, dùng để treo áo.",
 "Bạn có thể treo áo khoác lên giá treo áo gần lối vào.");

mcq(7,"A",2,"The secretary keeps confidential documents in the ______.",
 ["filing cabinet","office chair","office supply store","brochure"],"A",
 "“Filing cabinet” = tủ đựng hồ sơ, nơi lưu giữ tài liệu mật.",
 "Thư ký giữ những tài liệu mật trong tủ đựng hồ sơ.");

mcq(8,"A",2,"The company has recently purchased ______ office furniture with the latest designs.",
 ["traditional","modern","familiar","qualified"],"B",
 "“Modern” = hiện đại, phù hợp với “the latest designs” (thiết kế mới nhất).",
 "Công ty gần đây đã mua nội thất văn phòng hiện đại với những thiết kế mới nhất.");

mcq(9,"A",2,"This store offers ______ office chairs, desks, and filing cabinets.",
 ["a large selection of","in charge of","keep track of","put on hold"],"A",
 "“A large selection of” = nhiều, đa dạng (một sự lựa chọn phong phú).",
 "Cửa hàng này cung cấp nhiều loại ghế văn phòng, bàn làm việc và tủ hồ sơ.");

mcq(10,"A",2,"The customer must pay an additional ______ for delivering the furniture.",
 ["recruitment","delivery charge","business letter","order form"],"B",
 "“Delivery charge” = phí giao hàng. Câu nói về khoản phí phụ thu để giao nội thất.",
 "Khách hàng phải trả thêm một khoản phí giao hàng để vận chuyển nội thất.");

mcq(11,"A",3,"The secretary must ______ the documents before the meeting begins.",
 ["prepare","greet","hire","connect"],"A",
 "“Prepare” = chuẩn bị. Thư ký chuẩn bị tài liệu trước cuộc họp.",
 "Thư ký phải chuẩn bị tài liệu trước khi cuộc họp bắt đầu.");

mcq(12,"A",3,"The manager sent a short ______ to inform all employees about the meeting.",
 ["receipt","memo","brochure","cover letter"],"B",
 "“Memo” = bản ghi nhớ nội bộ gửi cho nhân viên trong công ty.",
 "Người quản lý đã gửi một bản ghi nhớ ngắn để thông báo cho tất cả nhân viên về cuộc họp.");

mcq(13,"A",3,"Please ______ this form with your name, address, and phone number.",
 ["sign in","fill out","leave","transfer"],"B",
 "“Fill out” = điền vào (biểu mẫu). Cụm “fill out a form” rất thông dụng.",
 "Vui lòng điền tên, địa chỉ và số điện thoại của bạn vào biểu mẫu này.");

mcq(14,"A",3,"After buying the office equipment, remember to keep the ______.",
 ["receipt","title","visitor’s pass","shelf"],"A",
 "“Receipt” = biên nhận/hóa đơn, cần giữ lại sau khi mua hàng.",
 "Sau khi mua thiết bị văn phòng, hãy nhớ giữ lại biên nhận.");

mcq(15,"A",3,"She sent her CV and ______ to apply for the secretary position.",
 ["business letter","order form","cover letter","memo"],"C",
 "“Cover letter” = thư xin việc, gửi kèm CV khi ứng tuyển.",
 "Cô ấy đã gửi CV và thư xin việc để ứng tuyển vị trí thư ký.");

mcq(16,"A",3,"A ______ is a person or organization that receives professional services from a company.",
 ["caller","client","employee","retailer"],"B",
 "“Client” = khách hàng, người/tổ chức sử dụng dịch vụ chuyên nghiệp của công ty.",
 "Client là một cá nhân hoặc tổ chức nhận dịch vụ chuyên nghiệp từ một công ty.");

mcq(17,"A",4,"The receptionist welcomed the visitors and asked them to ______ at the front desk.",
 ["sign in","put on hold","fill out","keep track of"],"A",
 "“Sign in” = ghi tên/đăng ký khi đến, thường làm tại bàn tiếp tân.",
 "Nhân viên tiếp tân chào đón khách và yêu cầu họ đăng ký tại bàn tiếp tân.");

mcq(18,"A",4,"Please wear your ______ while visiting the company’s offices.",
 ["visitor’s pass","office supplies","business letter","delivery charge"],"A",
 "“Visitor’s pass” = thẻ khách, phải đeo khi ở trong tòa nhà.",
 "Vui lòng đeo thẻ khách trong khi bạn đến thăm văn phòng công ty.");

mcq(19,"A",4,"The receptionist made a good ______ by greeting the visitor politely.",
 ["first impression","recruitment","quality","policy"],"A",
 "“First impression” = ấn tượng ban đầu. Cụm “make a good first impression”.",
 "Nhân viên tiếp tân đã tạo ấn tượng ban đầu tốt bằng cách chào đón khách một cách lịch sự.");

mcq(20,"A",4,"Before the meeting, the new employee had to ______ to the other members of the team.",
 ["introduce yourself","introduce himself","introduction","greet himself"],"B",
 "Chủ ngữ là “the new employee” (số ít, giới tính nam trong ngữ cảnh) nên dùng “introduce himself”. “Introduce yourself” dùng khi nói với ngôi thứ hai.",
 "Trước cuộc họp, nhân viên mới phải tự giới thiệu bản thân với các thành viên khác trong nhóm.");

mcq(21,"A",5,"A good secretary should be ______ and finish tasks on time.",
 ["hard-working","stressed","traditional","brand new"],"A",
 "“Hard-working” = siêng năng, chăm chỉ — phù hợp với việc hoàn thành công việc đúng hạn.",
 "Một thư ký giỏi nên siêng năng và hoàn thành công việc đúng hạn.");

mcq(22,"A",5,"We need an ______ employee who can complete tasks quickly and accurately.",
 ["efficient","familiar","courteous","modern"],"A",
 "“Efficient” = hiệu quả, làm việc có năng suất — phù hợp với “quickly and accurately”.",
 "Chúng tôi cần một nhân viên làm việc hiệu quả, có thể hoàn thành nhiệm vụ nhanh chóng và chính xác.");

mcq(23,"A",5,"You can trust Minh with important tasks because he is very ______.",
 ["stressed","reliable","talented","traditional"],"B",
 "“Reliable” = đáng tin cậy. Câu nói về việc có thể tin tưởng giao việc quan trọng.",
 "Bạn có thể tin tưởng giao cho Minh những nhiệm vụ quan trọng vì anh ấy rất đáng tin cậy.");

mcq(24,"A",5,"The company is looking for a ______ secretary who has the necessary skills and qualifications.",
 ["qualified","welcomed","organized","friendly"],"A",
 "“Qualified” = đủ điều kiện, đủ khả năng — đi với “skills and qualifications”.",
 "Công ty đang tìm kiếm một thư ký đủ điều kiện, có các kỹ năng và bằng cấp cần thiết.");

mcq(25,"A",5,"A good personal assistant should be ______ with office software and computer systems.",
 ["familiar","successful","stressed","traditional"],"A",
 "“Familiar with” = quen thuộc, thông thạo một thứ gì đó.",
 "Một trợ lý cá nhân giỏi nên thông thạo phần mềm văn phòng và hệ thống máy tính.");

mcq(26,"A",6,"The ______ is responsible for ordering materials and office equipment.",
 ["marketing department","purchasing department","sales department","human resources department"],"B",
 "“Purchasing department” = bộ phận thu mua, chịu trách nhiệm đặt mua vật tư, thiết bị.",
 "Bộ phận thu mua chịu trách nhiệm đặt mua vật tư và thiết bị văn phòng.");

mcq(27,"A",6,"If you want to apply for a job, you should contact the ______.",
 ["purchasing department","sales department","human resources department","marketing department"],"C",
 "“Human resources department” = bộ phận nhân sự, phụ trách tuyển dụng.",
 "Nếu bạn muốn ứng tuyển một công việc, bạn nên liên hệ bộ phận nhân sự.");

mcq(28,"A",6,"The company plans to ______ five new employees next month.",
 ["greet","hire","prepare","transfer"],"B",
 "“Hire” = thuê, tuyển dụng nhân viên mới.",
 "Công ty dự định tuyển dụng năm nhân viên mới vào tháng tới.");

mcq(29,"A",6,"The company is looking for a talented ______ to design its advertisements.",
 ["graphic designer","receptionist","personal assistant","retailer"],"A",
 "“Graphic designer” = nhà thiết kế đồ họa — người thiết kế quảng cáo.",
 "Công ty đang tìm kiếm một nhà thiết kế đồ họa tài năng để thiết kế quảng cáo.");

mcq(30,"A",6,"The receptionist gave the visitor a company ______ containing information about its products and services.",
 ["receipt","brochure","folder","memo"],"B",
 "“Brochure” = tờ gấp quảng cáo, chứa thông tin về sản phẩm và dịch vụ.",
 "Nhân viên tiếp tân đưa cho vị khách một tờ gấp quảng cáo của công ty chứa thông tin về sản phẩm và dịch vụ.");

mcq(31,"A",7,"Good telephone ______ helps employees communicate politely and professionally.",
 ["furniture","etiquette","recruitment","introduction"],"B",
 "“Etiquette” = nghi thức, phép lịch sự trong giao tiếp.",
 "Phép lịch sự khi giao tiếp qua điện thoại giúp nhân viên giao tiếp một cách lịch sự và chuyên nghiệp.");

mcq(32,"A",7,"The receptionist felt ______ because the phone kept ringing while several visitors were waiting.",
 ["reliable","stressed","qualified","organized"],"B",
 "“Stressed” = căng thẳng — phù hợp với tình huống điện thoại reo liên tục và nhiều khách đang chờ.",
 "Nhân viên tiếp tân cảm thấy căng thẳng vì điện thoại liên tục reo trong khi nhiều vị khách đang chờ.");

mcq(33,"A",7,"Please be ______ when speaking to customers on the telephone.",
 ["courteous","traditional","successful","modern"],"A",
 "“Courteous” = lịch sự, nhã nhặn — dùng cho cách nói chuyện với khách.",
 "Vui lòng lịch sự khi nói chuyện với khách hàng qua điện thoại.");

mcq(34,"A",7,"The phone ______ while I was preparing the documents.",
 ["greeted","rang","hired","filled"],"B",
 "“Ring” = reo chuông; dạng quá khứ là “rang”. Câu dùng thì quá khứ đơn.",
 "Điện thoại reo trong khi tôi đang chuẩn bị tài liệu.");

mcq(35,"A",7,"The ______ asked to speak to the manager about an order.",
 ["caller","retailer","employee","secretary"],"A",
 "“Caller” = người gọi điện thoại.",
 "Người gọi điện đã yêu cầu được nói chuyện với người quản lý về một đơn hàng.");

mcq(36,"A",7,"Please wait a moment. I will ______ to the sales department.",
 ["leave your message","transfer your call","sign you in","fill you out"],"B",
 "“Transfer a call” = chuyển cuộc gọi sang bộ phận khác.",
 "Vui lòng chờ một lát. Tôi sẽ chuyển cuộc gọi của bạn đến bộ phận bán hàng.");

mcq(37,"A",7,"Could you ______ me to the human resources department, please?",
 ["connect","announce","greet","prepare"],"A",
 "“Connect somebody to” = nối máy cho ai đến một bộ phận nào đó.",
 "Bạn có thể nối máy cho tôi đến bộ phận nhân sự được không?");

mcq(38,"A",7,"The manager is busy at the moment. Would you like to ______?",
 ["leave a message","make a receipt","sign a shelf","order a client"],"A",
 "“Leave a message” = để lại lời nhắn khi người cần gặp đang bận.",
 "Người quản lý hiện đang bận. Bạn có muốn để lại lời nhắn không?");

mcq(39,"A",7,"The receptionist asked the caller to ______ while she checked the manager’s availability.",
 ["put on hold","sign in","fill out","keep track of"],"A",
 "“Put on hold” = để chờ máy (trong khi kiểm tra thông tin).",
 "Nhân viên tiếp tân yêu cầu người gọi chờ máy trong khi cô kiểm tra xem người quản lý có rảnh không.");

mcq(40,"A",7,"The receptionist called the manager to ______ the visitor’s arrival.",
 ["announce","transfer","hire","inquire"],"A",
 "“Announce” = thông báo. Lễ tân thông báo cho quản lý về sự có mặt của khách.",
 "Nhân viên tiếp tân gọi cho người quản lý để thông báo về sự có mặt của vị khách.");

/* ---------- PART B : Grammar (41–75) ---------- */
mcq(41,"B",1,"The secretary ______ office supplies every month.",
 ["order","orders","ordering","to order"],"B",
 "Chủ ngữ số ít “The secretary” + thì hiện tại đơn (every month) → động từ thêm -s: “orders”.",
 "Thư ký đặt mua văn phòng phẩm mỗi tháng.");

mcq(42,"B",3,"The employees ______ the documents at the moment.",
 ["prepare","prepares","are preparing","prepared"],"C",
 "“At the moment” → thì hiện tại tiếp diễn. Chủ ngữ số nhiều “The employees” → “are preparing”.",
 "Các nhân viên đang chuẩn bị tài liệu vào lúc này.");

mcq(43,"B",1,"Ms. Lan ______ in charge of purchasing office furniture.",
 ["am","are","is","be"],"C",
 "“Ms. Lan” là chủ ngữ số ít → động từ to be là “is”.",
 "Cô Lan chịu trách nhiệm mua nội thất văn phòng.");

mcq(44,"B",2,"There ______ three filing cabinets in the office.",
 ["is","are","am","be"],"B",
 "Cấu trúc “There is/are”. Danh từ theo sau là số nhiều “three filing cabinets” → dùng “are”.",
 "Có ba tủ đựng hồ sơ trong văn phòng.");

mcq(45,"B",2,"The manager needs ______ a new office chair.",
 ["buy","buying","to buy","bought"],"C",
 "Cấu trúc “need + to V” (cần làm gì).",
 "Người quản lý cần mua một chiếc ghế văn phòng mới.");

mcq(46,"B",3,"We should ______ the receipt after purchasing the equipment.",
 ["keep","keeps","keeping","kept"],"A",
 "Sau động từ khuyết thiếu “should” dùng động từ nguyên mẫu không “to”: “keep”.",
 "Chúng ta nên giữ lại biên nhận sau khi mua thiết bị.");

mcq(47,"B",4,"The receptionist usually ______ visitors at the entrance.",
 ["greet","greets","greeting","greeted"],"B",
 "“Usually” → thì hiện tại đơn; chủ ngữ số ít → “greets”.",
 "Nhân viên tiếp tân thường chào đón khách tại lối vào.");

mcq(48,"B",5,"The secretary is responsible for ______ the director’s schedule.",
 ["arrange","arranges","arranging","arranged"],"C",
 "Cụm “be responsible for + V-ing”: sau giới từ “for” dùng động từ dạng -ing.",
 "Thư ký chịu trách nhiệm sắp xếp lịch trình của giám đốc.");

mcq(49,"B",6,"The company ______ five new employees last month.",
 ["hire","hires","hired","hiring"],"C",
 "“Last month” → thì quá khứ đơn → “hired”.",
 "Công ty đã tuyển dụng năm nhân viên mới vào tháng trước.");

mcq(50,"B",3,"The manager has already ______ the order form.",
 ["complete","completes","completed","completing"],"C",
 "Thì hiện tại hoàn thành: “has/have + V3/ed” → “has already completed”.",
 "Người quản lý đã hoàn thành mẫu đơn đặt hàng rồi.");

mcq(51,"B",7,"If a caller asks for the manager, I ______ the call.",
 ["transfer","transfers","transferred","transferring"],"A",
 "Câu điều kiện loại 1 diễn tả thói quen: mệnh đề “if” chia hiện tại đơn, mệnh đề chính cũng dùng hiện tại đơn với chủ ngữ “I” → “transfer”.",
 "Nếu người gọi hỏi gặp người quản lý, tôi sẽ chuyển cuộc gọi.");

mcq(52,"B",7,"The receptionist ______ a message when the phone rang.",
 ["takes","was taking","is taking","take"],"B",
 "Hành động đang xảy ra trong quá khứ (was taking) thì bị hành động khác xen vào (rang).",
 "Nhân viên tiếp tân đang ghi lời nhắn thì điện thoại reo.");

mcq(53,"B",3,"While the secretary ______ the documents, the manager entered the office.",
 ["prepares","prepared","was preparing","is preparing"],"C",
 "“While” + hành động đang tiếp diễn trong quá khứ → thì quá khứ tiếp diễn: “was preparing”.",
 "Trong khi thư ký đang chuẩn bị tài liệu thì người quản lý bước vào văn phòng.");

mcq(54,"B",2,"The company ______ a new line of office furniture next month.",
 ["introduces","introduced","is going to introduce","introducing"],"C",
 "“Next month” → tương lai. “Be going to + V” diễn tả kế hoạch đã định: “is going to introduce”.",
 "Công ty sẽ giới thiệu một dòng nội thất văn phòng mới vào tháng tới.");

mcq(55,"B",4,"The receptionist ______ the visitor’s pass before the visitor entered the building.",
 ["gives","gave","giving","give"],"B",
 "Diễn tả hành động xảy ra trước một hành động khác trong quá khứ, dùng quá khứ đơn: “gave”.",
 "Nhân viên tiếp tân đã đưa thẻ khách trước khi vị khách bước vào tòa nhà.");

mcq(56,"B",2,"The office furniture ______ delivered yesterday.",
 ["is","are","was","were"],"C",
 "Câu bị động thì quá khứ đơn. “Office furniture” là danh từ không đếm được → dùng số ít “was”.",
 "Nội thất văn phòng đã được giao vào ngày hôm qua.");

mcq(57,"B",3,"The documents ______ by the secretary every morning.",
 ["prepare","prepared","are prepared","is preparing"],"C",
 "Câu bị động thì hiện tại đơn: “are + V3/ed”. Chủ ngữ “The documents” số nhiều → “are prepared”.",
 "Các tài liệu được thư ký chuẩn bị mỗi buổi sáng.");

mcq(58,"B",5,"The company is looking for someone ______ can speak English fluently.",
 ["which","who","where","when"],"B",
 "Đại từ quan hệ “who” thay thế cho danh từ chỉ người (“someone”).",
 "Công ty đang tìm kiếm một người có thể nói tiếng Anh trôi chảy.");

mcq(59,"B",2,"This is the filing cabinet ______ contains the confidential documents.",
 ["who","where","which","when"],"C",
 "Đại từ quan hệ “which” thay thế cho danh từ chỉ vật (“the filing cabinet”).",
 "Đây là tủ đựng hồ sơ chứa các tài liệu mật.");

mcq(60,"B",4,"The receptionist is the person ______ greets visitors.",
 ["who","which","where","whose"],"A",
 "“Who” thay thế cho “the person” — danh từ chỉ người đóng vai trò chủ ngữ.",
 "Nhân viên tiếp tân là người chào đón khách.");

mcq(61,"B",5,"The company needs a secretary ______ is organized and reliable.",
 ["which","who","where","when"],"B",
 "“Who” thay thế cho “a secretary” — danh từ chỉ người.",
 "Công ty cần một thư ký là người ngăn nắp và đáng tin cậy.");

mcq(62,"B",3,"The manager asked me ______ the order form.",
 ["complete","completing","to complete","completed"],"C",
 "Cấu trúc “ask somebody to do something” → “asked me to complete”.",
 "Người quản lý yêu cầu tôi hoàn thành mẫu đơn đặt hàng.");

mcq(63,"B",4,"The receptionist told the visitor ______ at the reception desk.",
 ["wait","waiting","to wait","waited"],"C",
 "Cấu trúc “tell somebody to do something” → “told the visitor to wait”.",
 "Nhân viên tiếp tân bảo vị khách chờ ở bàn tiếp tân.");

mcq(64,"B",7,"Employees must ______ the company’s telephone policy.",
 ["follows","follow","following","followed"],"B",
 "Sau “must” dùng động từ nguyên mẫu không “to”: “follow”.",
 "Nhân viên phải tuân thủ quy định sử dụng điện thoại của công ty.");

mcq(65,"B",4,"You ______ be polite when speaking to clients.",
 ["should","should to","are","have"],"A",
 "“Should + V” dùng để đưa ra lời khuyên. “Should to” là sai ngữ pháp.",
 "Bạn nên lịch sự khi nói chuyện với khách hàng.");

mcq(66,"B",7,"The receptionist is busy ______ to a client on the phone.",
 ["talk","talks","talking","to talking"],"C",
 "Cấu trúc “be busy + V-ing” (đang bận làm gì).",
 "Nhân viên tiếp tân đang bận nói chuyện điện thoại với một khách hàng.");

mcq(67,"B",6,"The manager is interested in ______ a new personal assistant.",
 ["hire","hiring","hires","hired"],"B",
 "Cấu trúc “be interested in + V-ing”.",
 "Người quản lý quan tâm đến việc tuyển một trợ lý cá nhân mới.");

mcq(68,"B",5,"The secretary is good at ______ office documents.",
 ["organize","organizes","organizing","organized"],"C",
 "Cấu trúc “be good at + V-ing”.",
 "Thư ký giỏi trong việc sắp xếp tài liệu văn phòng.");

mcq(69,"B",6,"The company has ______ employees than it did last year.",
 ["much","more","most","many"],"B",
 "So sánh hơn với danh từ đếm được số nhiều: “more + N + than”.",
 "Công ty có nhiều nhân viên hơn so với năm ngoái.");

mcq(70,"B",2,"This is the ______ office chair in the store.",
 ["comfortable","more comfortable","most comfortable","comfortablest"],"C",
 "So sánh nhất với tính từ dài: “the most + adjective”.",
 "Đây là chiếc ghế văn phòng thoải mái nhất trong cửa hàng.");

mcq(71,"B",4,"The receptionist speaks ______ to visitors.",
 ["polite","politely","politeness","more polite"],"B",
 "Cần trạng từ bổ nghĩa cho động từ “speaks” → “politely”.",
 "Nhân viên tiếp tân nói chuyện lịch sự với khách.");

mcq(72,"B",3,"The secretary completed the task ______ and accurately.",
 ["efficient","efficiency","efficiently","efficiencies"],"C",
 "Cần trạng từ song song với “accurately” để bổ nghĩa cho “completed” → “efficiently”.",
 "Thư ký đã hoàn thành nhiệm vụ một cách hiệu quả và chính xác.");

mcq(73,"B",6,"There is ______ information about the job vacancy on the company website.",
 ["many","a few","some","an"],"C",
 "“Information” là danh từ không đếm được → dùng “some”. “Many/a few” chỉ dùng với danh từ đếm được số nhiều.",
 "Có một số thông tin về vị trí tuyển dụng trên website của công ty.");

mcq(74,"B",6,"The manager has worked at this law firm ______ 2022.",
 ["for","since","during","from"],"B",
 "“Since” + mốc thời gian cụ thể (2022). “For” + khoảng thời gian.",
 "Người quản lý đã làm việc tại công ty luật này từ năm 2022.");

mcq(75,"B",4,"The receptionist has been working here ______ three years.",
 ["since","for","at","on"],"B",
 "“For” + khoảng thời gian (three years). “Since” + mốc thời gian.",
 "Nhân viên tiếp tân đã làm việc ở đây được ba năm.");

/* ---------- PART C : Sentence Reordering (76–100) ---------- */
reo(76,"C",1,["office supplies","needs","the company","to buy","more"],[2,1,3,4,0],

/* ================================================================
   4. STATE + STORAGE
   ================================================================ */
const STORAGE_KEY = "efs_app_state_v1";

const DEFAULT_STATE = {
  vocab: {},
  questions: {},
  tests: [],
  sessions: [],
  settings: {
    audio: true,
    tts: true,
    rate: 1,
    animation: true,
    shuffleQuestions: false,
    shuffleAnswers: false
  }
};

let state = loadState();

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return JSON.parse(JSON.stringify(DEFAULT_STATE));
    const parsed = JSON.parse(raw);
    const s = JSON.parse(JSON.stringify(DEFAULT_STATE));
    if(parsed && typeof parsed === "object"){
      if(parsed.vocab && typeof parsed.vocab === "object") s.vocab = parsed.vocab;
      if(parsed.questions && typeof parsed.questions === "object") s.questions = parsed.questions;
      if(Array.isArray(parsed.tests)) s.tests = parsed.tests;
      if(Array.isArray(parsed.sessions)) s.sessions = parsed.sessions;
      if(parsed.settings && typeof parsed.settings === "object"){
        Object.keys(DEFAULT_STATE.settings).forEach(k=>{
          if(typeof parsed.settings[k] !== "undefined") s.settings[k] = parsed.settings[k];
        });
      }
    }
    return s;
  }catch(e){
    console.warn("Không đọc được dữ liệu đã lưu, dùng dữ liệu mới.", e);
    return JSON.parse(JSON.stringify(DEFAULT_STATE));
  }
}

let saveTimer = null;
function saveState(immediate){
  if(saveTimer) clearTimeout(saveTimer);
  const doSave = ()=>{
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
    catch(e){ console.warn("Không lưu được dữ liệu.", e); }
  };
  if(immediate) doSave(); else saveTimer = setTimeout(doSave, 120);
}

/* ---------- Vocabulary status helpers ---------- */
function vStatus(id){ return state.vocab[id] || "new"; }
function setVStatus(id, st){
  if(st === "new") delete state.vocab[id];
  else state.vocab[id] = st;
  saveState();
  updateChrome();
}
function isLearned(id){ return vStatus(id) === "learned"; }
function isDifficult(id){ return vStatus(id) === "difficult"; }

/* ---------- Question stats helpers ---------- */
function qStat(id){
  if(!state.questions[id]) state.questions[id] = {seen:0, correct:0, wrong:0, flagged:false, lastCorrect:null};
  return state.questions[id];
}
function recordAnswer(id, correct){
  const s = qStat(id);
  s.seen++;
  if(correct) s.correct++; else s.wrong++;
  s.lastCorrect = correct;
  saveState();
}
function toggleFlag(id){
  const s = qStat(id);
  s.flagged = !s.flagged;
  saveState();
  return s.flagged;
}

/* ---------- Derived statistics ---------- */
function vocabStats(){
  let learned = 0, difficult = 0, learning = 0;
  VOCAB.forEach(v=>{
    const st = vStatus(v.id);
    if(st === "learned") learned++;
    else if(st === "difficult") difficult++;
    else if(st === "learning") learning++;
  });
  const total = VOCAB.length;
  const notLearned = total - learned;
  const progress = total ? Math.round(learned / total * 100) : 0;
  return {total, learned, difficult, learning, notLearned, progress, newCount: total - learned - difficult - learning};
}
function unitStats(unitId){
  const list = VOCAB.filter(v=>v.unit === unitId);
  let learned = 0, difficult = 0;
  list.forEach(v=>{
    const st = vStatus(v.id);
    if(st === "learned") learned++;
    else if(st === "difficult") difficult++;
  });
  return {total:list.length, learned, difficult, notLearned:list.length - learned, progress: list.length ? Math.round(learned/list.length*100) : 0};
}
function questionStats(){
  let answered = 0, correct = 0, wrong = 0;
  Q.forEach(q=>{
    const s = state.questions[q.id];
    if(s && s.seen > 0){
      answered++;
      if(s.lastCorrect) correct++; else wrong++;
    }
  });
  const total = Q.length;
  return {total, answered, correct, wrong, unanswered: total - answered,
          accuracy: answered ? Math.round(correct/answered*100) : 0};
}

/* ================================================================
   5. AUDIO MANAGER (British English)
   ================================================================ */
const missingAudio = new Set();
let currentAudioEl = null;

function getBritishVoice(){
  if(!("speechSynthesis" in window)) return null;
  const voices = window.speechSynthesis.getVoices() || [];
  let v = voices.find(x => /en[-_]GB/i.test(x.lang));
  if(v) return v;
  v = voices.find(x => /en[-_]GB/i.test(x.name));
  return v || null;
}
if("speechSynthesis" in window){
  window.speechSynthesis.onvoiceschanged = ()=>{ /* warm up */ };
  window.speechSynthesis.getVoices();
}

function stopAudio(){
  if(currentAudioEl){ try{ currentAudioEl.pause(); }catch(e){} currentAudioEl = null; }
  if("speechSynthesis" in window){ try{ window.speechSynthesis.cancel(); }catch(e){} }
  document.querySelectorAll(".icon-btn.playing").forEach(b=>b.classList.remove("playing"));
}

function playSound(src, text, btn){
  if(!state.settings.audio){ toast("Âm thanh đang tắt. Bật trong Settings."); return; }
  stopAudio();
  if(btn) btn.classList.add("playing");
  const clearBtn = ()=>{ if(btn) btn.classList.remove("playing"); };

  if(src && !missingAudio.has(src)){
    const a = new Audio(src);
    a.playbackRate = Number(state.settings.rate) || 1;
    currentAudioEl = a;
    let handled = false;
    const fail = ()=>{
      if(handled) return; handled = true;
      missingAudio.add(src);
      clearBtn();
      fallbackTTS(text, btn);
    };
    a.addEventListener("error", fail);
    a.addEventListener("ended", clearBtn);
    const p = a.play();
    if(p && p.catch) p.catch(fail);
    return;
  }
  fallbackTTS(text, btn);
}

function fallbackTTS(text, btn){
  if(!state.settings.audio) return;
  if(!state.settings.tts){ toast("Audio unavailable"); if(btn) btn.classList.remove("playing"); return; }
  if(!("speechSynthesis" in window)){ toast("Audio unavailable – thiết bị không hỗ trợ."); if(btn) btn.classList.remove("playing"); return; }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-GB";
  u.rate = Number(state.settings.rate) || 1;
  const v = getBritishVoice();
  if(v) u.voice = v;
  u.onstart = ()=>{ if(btn) btn.classList.add("playing"); };
  u.onend = ()=>{ if(btn) btn.classList.remove("playing"); };
  u.onerror = ()=>{ if(btn) btn.classList.remove("playing"); };
  try{ window.speechSynthesis.cancel(); window.speechSynthesis.speak(u); }
  catch(e){ if(btn) btn.classList.remove("playing"); toast("Audio unavailable"); }
}

/* ================================================================
   6. UI UTILITIES
   ================================================================ */
function toast(msg, ms){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>t.classList.remove("show"), ms || 2000);
}
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function fmtTime(sec){
  const m = Math.floor(sec/60), s = sec % 60;
  return m + " phút " + s + " giây";
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return "";
  const d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString("vi-VN", {day:"2-digit", month:"2-digit", year:"numeric"}) + " " +
         d.toLocaleTimeString("vi-VN", {hour:"2-digit", minute:"2-digit"});
}
function modal(opts){
  const root = document.getElementById("modalRoot");
  const bg = document.createElement("div");
  bg.className = "modal-bg";
  bg.innerHTML = `
    <div class="modal">
      <h3>${esc(opts.title || "")}</h3>
      <p>${opts.message || ""}</p>
      <div class="row">
        ${opts.cancelText ? `<button class="btn ghost" data-act="cancel">${esc(opts.cancelText)}</button>` : ""}
        <button class="btn ${opts.danger ? "red" : ""}" data-act="ok">${esc(opts.okText || "OK")}</button>
      </div>
    </div>`;
  root.appendChild(bg);
  const close = ()=>{ bg.remove(); };
  bg.addEventListener("click", (e)=>{
    if(e.target === bg){ close(); if(opts.onCancel) opts.onCancel(); return; }
    const act = e.target.getAttribute("data-act");
    if(act === "ok"){ close(); if(opts.onOk) opts.onOk(); }
    if(act === "cancel"){ close(); if(opts.onCancel) opts.onCancel(); }
  });
}

let currentView = "dashboard";

function buildNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = NAV.map(n=>`
    <button class="sb-item ${n.id===currentView?"active":""}" data-nav="${n.id}">
      <span class="ico">${n.ico}</span><span>${n.label}</span>

  nav.querySelectorAll("[data-nav]").forEach(b=>{
    b.addEventListener("click", ()=>{ navigate(b.getAttribute("data-nav")); closeSidebar(); });

  stopAudio();
  currentView = view;
  buildNav();

function render(){
  const view = document.getElementById("view");

    case "dashboard":  view.innerHTML = viewDashboard();  afterDashboard(); break;
    case "vocabulary": view.innerHTML = viewVocabulary(); afterVocabulary(); break;
    case "flashcards": view.innerHTML = viewFlashcards(); afterFlashcards(); break;
    case "practice":   view.innerHTML = viewPractice();   afterPractice(); break;
    case "test":       view.innerHTML = viewTest();       afterTest(); break;
    case "progress":   view.innerHTML = viewProgress();   break;
    case "settings":   view.innerHTML = viewSettings();   afterSettings(); break;
  }
}

  v.querySelectorAll("[data-continue]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const u = Number(b.getAttribute("data-continue"));
      startFlashcards("unit", u);
    });
  });
  v.querySelectorAll("[data-review]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const u = Number(b.getAttribute("data-review"));
      navigate("vocabulary");
      setTimeout(()=>{ vocabState.unit = u; render(); }, 10);
    });
  });
  v.querySelectorAll("[data-quick]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const a = b.getAttribute("data-quick");
      if(a === "continue"){
        const next = VOCAB.find(x=>vStatus(x.id) === "new" || vStatus(x.id) === "learning");
        startFlashcards(next ? "unit" : "all", next ? next.unit : 1);
      }
      else if(a === "difficult") startFlashcards("difficult");
      else if(a === "flashcards") startFlashcards("all");
      else if(a === "practice"){ practiceState = null; navigate("practice"); }
      else if(a === "test"){ testState = null; navigate("test"); }
    });
  });
}

/* ================================================================
   10. VOCABULARY VIEW
   ================================================================ */
const vocabState = { unit: 0, search: "", pos: "", status: "all" };

function viewVocabulary(){
  const posList = Array.from(new Set(VOCAB.map(v=>v.partOfSpeech))).sort();

  let list = VOCAB.slice();
  if(vocabState.unit) list = list.filter(v=>v.unit === vocabState.unit);
  if(vocabState.pos) list = list.filter(v=>v.partOfSpeech === vocabState.pos);
  if(vocabState.status !== "all"){
    list = list.filter(v=>{
      const st = vStatus(v.id);
      if(vocabState.status === "new") return st === "new" || st === "learning";
      return st === vocabState.status;
    });
  }
  const term = vocabState.search.trim().toLowerCase();
  if(term){
    list = list.filter(v=>{
      const unit = UNIT_MAP[v.unit];
      return (v.word + " " + v.vietnameseMeaning + " " + v.partOfSpeech + " " +
              (unit ? unit.title + " " + unit.vi : "")).toLowerCase().includes(term);
    });
  }

  const cards = list.length ? list.map(v=>{
    const st = vStatus(v.id);
    const cls = st === "learned" ? "learned" : st === "difficult" ? "difficult" : st === "learning" ? "learning" : "";
    const badge = st === "learned" ? `<span class="pill green">Đã học</span>`
                : st === "difficult" ? `<span class="pill amber">Từ khó</span>`
                : st === "learning" ? `<span class="pill">Đang học</span>`
                : `<span class="pill gray">Chưa học</span>`;
    return `
    <div class="vcard ${cls}">
      <div class="vc-top">
        <div style="flex:1;min-width:150px">
          <div class="vc-word">${esc(v.word)}</div>
          <div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:3px">
            <span class="vc-pos">${esc(v.partOfSpeech)}</span>
            ${v.ipa ? `<span class="vc-ipa">${esc(v.ipa)}</span>` : ""}
          </div>
        </div>
        ${badge}
      </div>
      <div class="vc-vi">${esc(v.vietnameseMeaning)}</div>
      <div class="vc-ex">
        <b>${esc(v.example)}</b>
        <span class="vi">${esc(v.exampleTranslation)}</span>
      </div>
      <div class="vc-actions">
        <button class="icon-btn" data-play-word="${v.id}" title="Nghe từ (Anh–Anh)">🔊</button>
        <button class="icon-btn" data-play-ex="${v.id}" title="Nghe câu ví dụ">🗣</button>
        <button class="btn sm ${st === "learned" ? "green" : "ghost"}" data-learned="${v.id}">
          ${st === "learned" ? "✓ Đã học" : "Đánh dấu đã học"}
        </button>
        <button class="btn sm ${st === "difficult" ? "amber" : "ghost"}" data-difficult="${v.id}">
          ${st === "difficult" ? "★ Từ khó" : "Đánh dấu từ khó"}
        </button>
      </div>
    </div>`;
  }).join("") : `<div class="empty"><div class="big">🔍</div><p>Không tìm thấy từ vựng phù hợp.</p></div>`;

  const unitTabs = `<button class="tab ${vocabState.unit===0?"active":""}" data-unit="0">Tất cả (89)</button>` +
    UNITS.map(u=>`<button class="tab ${vocabState.unit===u.id?"active":""}" data-unit="${u.id}">U${u.id} · ${u.title}</button>`).join("");

  return `
  <div class="page-head">
    <h2>Vocabulary</h2>
    <p>89 từ vựng thuộc 7 Units – tra cứu, nghe phát âm Anh–Anh, đánh dấu từ đã học và từ khó.</p>
  </div>

  <div class="tabs" style="margin-bottom:14px">${unitTabs}</div>

  <div class="toolbar">
    <input class="field" id="vSearch" placeholder="Tìm theo từ tiếng Anh, nghĩa tiếng Việt, Unit..." value="${esc(vocabState.search)}">
    <select class="field" id="vPos">
      <option value="">Tất cả từ loại</option>
      ${posList.map(p=>`<option value="${esc(p)}" ${vocabState.pos===p?"selected":""}>${esc(p)}</option>`).join("")}
    </select>
    <select class="field" id="vStatus">
      <option value="all" ${vocabState.status==="all"?"selected":""}>Tất cả trạng thái</option>
      <option value="new" ${vocabState.status==="new"?"selected":""}>Chưa học</option>
      <option value="learning" ${vocabState.status==="learning"?"selected":""}>Đang học</option>
      <option value="learned" ${vocabState.status==="learned"?"selected":""}>Đã học</option>
      <option value="difficult" ${vocabState.status==="difficult"?"selected":""}>Từ khó</option>
    </select>
    <button class="btn ghost sm" id="vClear">Xóa bộ lọc</button>
  </div>

  <p style="font-size:13px;color:var(--muted);margin-bottom:12px">Hiển thị <b>${list.length}</b> từ vựng</p>

  <div class="grid g-2">${cards}</div>`;
}

function afterVocabulary(){
  const v = document.getElementById("view");

  v.querySelectorAll("[data-unit]").forEach(b=>{
    b.addEventListener("click", ()=>{ vocabState.unit = Number(b.getAttribute("data-unit")); render(); });
  });

  const search = document.getElementById("vSearch");

    search.addEventListener("input", ()=>{

        render();
        const s2 = document.getElementById("vSearch");

  if(st) st.addEventListener("change", ()=>{ vocabState.status = st.value; render(); });
  const cl = document.getElementById("vClear");

      if(item) playSound(item.audioWord, item.word, b);
    });
  });
  v.querySelectorAll("[data-play-ex]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const item = VOCAB_MAP[b.getAttribute("data-play-ex")];
      if(item) playSound(item.audioExample, item.example, b);
    });
  });
  v.querySelectorAll("[data-learned]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const id = b.getAttribute("data-learned");
      setVStatus(id, vStatus(id) === "learned" ? "new" : "learned");
      render();
    });
  });
  v.querySelectorAll("[data-difficult]").forEach(b=>{
    b.addEventListener("click", ()=>{
      const id = b.getAttribute("data-difficult");
      setVStatus(id, vStatus(id) === "difficult" ? "new" : "difficult");
      render();
    });
  });
}

/* ================================================================
   11. FLASHCARDS
   ================================================================ */
let fcState = null;

function buildFlashcardList(mode, unitId){
  let list;
  if(mode === "all") list = VOCAB.slice();
  else if(mode === "unit") list = VOCAB.filter(v=>v.unit === unitId);
  else if(mode === "learned") list = VOCAB.filter(v=>isLearned(v.id));
  else if(mode === "difficult") list = VOCAB.filter(v=>isDifficult(v.id));
  else if(mode === "unlearned") list = VOCAB.filter(v=>!isLearned(v.id));
  else if(mode === "random") list = shuffle(VOCAB);
  else list = VOCAB.slice();
  return list;
}

function startFlashcards(mode, unitId){
  stopAudio();
  const list = buildFlashcardList(mode, unitId);
  if(!list.length){
    toast("Không có từ vựng nào trong nhóm này.");
    return;
  }
  fcState = {
    mode, unitId: unitId || 0,
    list,
    idx: 0,
    flipped: false,
    viewed: new Set(),
    startedAt: Date.now(),
    finished: false
  };
  currentView = "flashcards";
  buildNav();
  document.getElementById("tbTitle").textContent = "Flashcards";
  render();
  window.scrollTo({top:0});
}

function viewFlashcards(){
  if(!fcState) return flashcardsMenu();
  if(fcState.finished) return flashcardsSummary();
  return flashcardsStage();
}

function flashcardsMenu(){
  const difficultCount = VOCAB.filter(v=>isDifficult(v.id)).length;
  const learnedCount = VOCAB.filter(v=>isLearned(v.id)).length;
  const unlearnedCount = VOCAB.length - learnedCount;

  const modes = [
    {key:"all", ico:"◧", title:"Learn All Vocabulary", desc:`Học toàn bộ ${VOCAB.length} từ vựng của 7 Units.`},
    {key:"unlearned", ico:"◻", title:"Review Unlearned Words", desc:`${unlearnedCount} từ chưa được đánh dấu đã học.`},
    {key:"learned", ico:"✓", title:"Review Learned Words", desc:`${learnedCount} từ bạn đã đánh dấu đã học.`},
    {key:"difficult", ico:"★", title:"Review Difficult Words", desc:`${difficultCount} từ bạn đã đánh dấu là từ khó.`},
    {key:"random", ico:"⇄", title:"Random Flashcards", desc:"Xáo trộn toàn bộ 89 từ vựng và học ngẫu nhiên."}
  ];

  const unitModes = UNITS.map(u=>{
    const st = unitStats(u.id);
    return `<button class="mode-card" data-fc-unit="${u.id}">
      <div class="mi">U${u.id}</div>
      <div>
        <h4>${esc(u.title)}</h4>
        <p>${esc(u.vi)} · ${st.total} từ · ${st.learned} đã học (${st.progress}%)</p>
      </div>
    </button>`;
  }).join("");

  return `
  <div class="page-head">
    <h2>Flashcards</h2>
    <p>Chọn chế độ học. Bạn có thể lật thẻ bằng cách nhấn vào thẻ, nút Flip hoặc phím Space.</p>
  </div>

  <div class="grid g-2" style="margin-bottom:22px">
    ${modes.map(m=>`
      <button class="mode-card" data-fc-mode="${m.key}">
        <div class="mi">${m.ico}</div>
        <div><h4>${esc(m.title)}</h4><p>${esc(m.desc)}</p></div>
      </button>`).join("")}
  </div>

  <div class="card">
    <h3 style="font-size:16px;margin-bottom:14px">Learn by Unit</h3>
    <div class="grid g-2">${unitModes}</div>
  </div>`;
}

function afterFlashcards(){
  const v = document.getElementById("view");
  v.querySelectorAll("[data-fc-mode]").forEach(b=>{
    b.addEventListener("click", ()=> startFlashcards(b.getAttribute("data-fc-mode")));
  });
  v.querySelectorAll("[data-fc-unit]").forEach(b=>{
    b.addEventListener("click", ()=> startFlashcards("unit", Number(b.getAttribute("data-fc-unit"))));
  });

  if(fcState && !fcState.finished){
    const card = document.getElementById("fcCard");
    if(card){
      card.addEventListener("click", (e)=>{
        if(e.target.closest(".icon-btn") || e.target.closest("button.btn")) return;
        flipCard();
      });
    }
    const fl = document.getElementById("fcFlip");
    if(fl) fl.addEventListener("click", flipCard);
    const pv = document.getElementById("fcPrev");
    if(pv) pv.addEventListener("click", ()=>{ if(fcState.idx > 0){ fcState.idx--; fcState.flipped = false; render(); } });
    const nx = document.getElementById("fcNext");
    if(nx) nx.addEventListener("click", nextCard);
    const sh = document.getElementById("fcShuffle");
    if(sh) sh.addEventListener("click", ()=>{
      fcState.list = shuffle(fcState.list); fcState.idx = 0; fcState.flipped = false; render();
      toast("Đã xáo trộn thẻ");
    });
    const rs = document.getElementById("fcRestart");
    if(rs) rs.addEventListener("click", ()=>{
      fcState.idx = 0; fcState.flipped = false; fcState.viewed.clear(); render();
    });
    const ml = document.getElementById("fcMarkLearned");
    if(ml) ml.addEventListener("click", ()=>{
      const item = fcState.list[fcState.idx];
      if(vStatus(item.id) === "learned"){ setVStatus(item.id, "new"); }
      else { setVStatus(item.id, "learned"); }
      render();
    });
    const md = document.getElementById("fcMarkDiff");
    if(md) md.addEventListener("click", ()=>{
      const item = fcState.list[fcState.idx];
      if(isDifficult(item.id)) setVStatus(item.id, "new");
      else setVStatus(item.id, "difficult");
      render();
    });
    // Audio: front face play button
    const pwF = document.getElementById("fcPlayWordFront");
    if(pwF) pwF.addEventListener("click", (e)=>{
      e.stopPropagation();
      const it = fcState.list[fcState.idx]; playSound(it.audioWord, it.word, pwF);
    });
    // Audio: back face play buttons
    const pwB = document.getElementById("fcPlayWordBack");
    if(pwB) pwB.addEventListener("click", (e)=>{
      e.stopPropagation();
      const it = fcState.list[fcState.idx]; playSound(it.audioWord, it.word, pwB);
    });
    const peB = document.getElementById("fcPlayExBack");
    if(peB) peB.addEventListener("click", (e)=>{
      e.stopPropagation();
      const it = fcState.list[fcState.idx]; playSound(it.audioExample, it.example, peB);
    });
  }

  const again = document.getElementById("fcAgain");
  if(again) again.addEventListener("click", ()=>{
    const m = fcState.mode, u = fcState.unitId;
    startFlashcards(m, u);
  });
  const home = document.getElementById("fcHome");
  if(home) home.addEventListener("click", ()=>{ fcState = null; navigate("dashboard"); });
}

function flipCard(){
  if(!fcState) return;
  const card = document.getElementById("fcCard");
  if(!card) return;
  fcState.flipped = !fcState.flipped;
  card.classList.toggle("flipped", fcState.flipped);
  const item = fcState.list[fcState.idx];
  if(item && !fcState.viewed.has(item.id)){
    fcState.viewed.add(item.id);
    if(vStatus(item.id) === "new") setVStatus(item.id, "learning");
  }
  saveState();
}

function nextCard(){
  if(!fcState) return;
  const item = fcState.list[fcState.idx];
  if(item) fcState.viewed.add(item.id);
  if(fcState.idx < fcState.list.length - 1){
    fcState.idx++;
    fcState.flipped = false;
    render();
  } else {
    fcState.finished = true;
    const dur = Math.round((Date.now() - fcState.startedAt)/1000);
    state.sessions.push({
      date: new Date().toISOString(),
      type: "flashcards",
      mode: fcState.mode,
      unit: fcState.unitId || null,
      cards: fcState.list.length,
      viewed: fcState.viewed.size,
      duration: dur
    });
    saveState(true);
    render();
  }
}

            <div class="fc-word">${esc(item.word)}</div>
            <div class="fc-pos">${esc(item.partOfSpeech)}</div>
            ${item.ipa ? `<div class="fc-ipa">${esc(item.ipa)}</div>` : ""}
            <button class="icon-btn" id="fcPlayWordFront" title="Nghe phát âm Anh–Anh" style="width:44px;height:44px;font-size:18px;margin-top:6px">🔊</button>
            <div class="fc-hint">Nhấn vào thẻ, nút Flip hoặc phím Space để xem nghĩa</div>
          </div>
        </div>
        <!-- BACK -->
        <div class="fc-face fc-back">
          <div class="fc-badge">Mặt sau · Nghĩa &amp; ví dụ</div>
          <div class="fc-center" style="justify-content:flex-start;align-items:stretch;text-align:left;gap:13px">
            <div>
              <div class="fc-vi">${esc(item.vietnameseMeaning)}</div>
              <div class="fc-pos" style="margin-top:3px">${esc(item.word)} ${esc(item.partOfSpeech)}</div>
            </div>
            <div class="fc-ex">
              <b>${esc(item.example)}</b>
              <span class="vi">${esc(item.exampleTranslation)}</span>
            </div>
            <div style="display:flex;gap:8px;flex-wrap:wrap">
              <button class="icon-btn" id="fcPlayWordBack" title="Nghe từ">🔊</button>
              <button class="icon-btn" id="fcPlayExBack" title="Nghe câu ví dụ">🗣</button>
            </div>
          </div>

      </div>
    </div>

      <button class="btn sm" id="fcFlip">⇅ Flip</button>

      <button class="btn ghost sm" id="fcShuffle">⇄ Shuffle</button>
      <button class="btn ghost sm" id="fcRestart">↺ Restart</button>
    </div>

    <div class="fc-controls">
      <button class="btn sm ${st==="learned"?"green":"ghost"}" id="fcMarkLearned">
        ${st==="learned" ? "✓ Đã học" : "Đánh dấu đã học"}
      </button>
      <button class="btn sm ${st==="difficult"?"amber":"ghost"}" id="fcMarkDiff">
        ${st==="difficult" ? "★ Từ khó" : "Đánh dấu từ khó"}
      </button>
    </div>
  </div>`;
}

function flashcardsSummary(){
  const viewed = fcState.viewed.size;

      <div class="stat"><div class="lbl">Từ khó</div><div class="val" style="color:var(--amber)">${diff}</div><div class="sub">trong bộ này</div></div>

}

    {key:"C", title:"Part C – Sentence Reordering", desc:"25 câu sắp xếp từ thành câu hoàn chỉnh."},
    {key:"wrong", title:"Practice Incorrect Questions", desc:`${wrongList.length} câu bạn từng trả lời sai.`},
    {key:"unanswered", title:"Practice Unanswered Questions", desc:`${unanswered.length} câu bạn chưa từng làm.`}

  <div class="page-head">
    <h2>Practice</h2>
    <p>Luyện tập toàn bộ 100 câu hỏi gốc. Đáp án và giải thích chỉ hiện sau khi bạn trả lời.</p>

function afterPractice(){
  const v = document.getElementById("view");
  v.querySelectorAll("[data-pr-mode]").forEach(b=>{
    b.addEventListener("click", ()=> startPractice(b.getAttribute("data-pr-mode")));
  });
  v.querySelectorAll("[data-pr-unit]").forEach(b=>{
    b.addEventListener("click", ()=> startPractice("unit", Number(b.getAttribute("data-pr-unit"))));
  });

  if(practiceState && !practiceState.finished){
    bindQuestionUI(practiceState);
    const sub = document.getElementById("prSubmit");
    if(sub) sub.addEventListener("click", ()=> submitPracticeAnswer());
    const prev = document.getElementById("prPrev");
    if(prev) prev.addEventListener("click", ()=>{
      if(practiceState.idx > 0){ practiceState.idx--; render(); }
    });
    const next = document.getElementById("prNext");
    if(next) next.addEventListener("click", ()=>{
      if(practiceState.idx < practiceState.list.length - 1){ practiceState.idx++; render(); }
      else finishPractice();
    });
    const flag = document.getElementById("prFlag");
    if(flag) flag.addEventListener("click", ()=>{
      toggleFlag(practiceState.list[practiceState.idx].id);
      render();
    });
    const fin = document.getElementById("prFinish");
    if(fin) fin.addEventListener("click", finishPractice);
  }

  const again = document.getElementById("prAgain");
  if(again) again.addEventListener("click", ()=>{
    const wrongIds = practiceState.wrongIds || [];
    if(wrongIds.length){
      practiceState = makePracticeState(wrongIds.map(id=>Q_MAP[id]).filter(Boolean), "Retry Incorrect");
      render();
    } else toast("Không có câu sai để làm lại.");
  });
  const retry = document.getElementById("prRetryAll");
  if(retry) retry.addEventListener("click", ()=>{
    const valid = ["all","A","B","C","unit","wrong","unanswered"];
    const m = valid.includes(practiceState.mode) ? practiceState.mode : "all";
    const u = practiceState.unitId;
    startPractice(m, u);
  });
  const home = document.getElementById("prHome");
  if(home) home.addEventListener("click", ()=>{ practiceState = null; navigate("dashboard"); });
}

function startPractice(mode, unitId){
  stopAudio();
  let list = [];
  if(mode === "all") list = Q.slice();
  else if(mode === "A" || mode === "B" || mode === "C") list = Q.filter(q=>q.part === mode);
  else if(mode === "unit") list = Q.filter(q=>q.unit === unitId);
  else if(mode === "wrong") list = Q.filter(q=>{ const s = state.questions[q.id]; return s && s.wrong > 0; });
  else if(mode === "unanswered") list = Q.filter(q=>{ const s = state.questions[q.id]; return !s || s.seen === 0; });

  if(!list.length){ toast("Không có câu hỏi nào trong nhóm này."); return; }
  if(state.settings.shuffleQuestions) list = shuffle(list);
  practiceState = makePracticeState(list, mode, unitId || 0);
  render();
  window.scrollTo({top:0});
}

function makePracticeState(list, mode, unitId){
  return {
    mode, unitId: unitId || 0,
    list,
    idx: 0,
    answers: {},
    startedAt: Date.now(),
    finished: false,
    wrongIds: [],
    _tempPicks: {},
    _tempOrders: {}
  };
}

function practiceQuestion(){
  const q = practiceState.list[practiceState.idx];
  const total = practiceState.list.length;
  const answeredCount = Object.keys(practiceState.answers).length;
  const pct = Math.round(answeredCount / total * 100);
  const st = practiceState.answers[q.id];
  const flagged = qStat(q.id).flagged;
  const tempPick = practiceState._tempPicks[q.id];
  const tempOrder = practiceState._tempOrders[q.id];

  return `
  <div style="max-width:860px;margin:0 auto">
    <div class="q-head">
      <div>
        <div class="q-num">Câu ${practiceState.idx + 1} / ${total} · Part ${q.part}${q.unit ? " · Unit " + q.unit : ""}</div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn ghost sm" id="prFlag">${flagged ? "★ Đã đánh dấu" : "☆ Flag"}</button>
        <button class="btn ghost sm" id="prFinish">Kết thúc</button>
      </div>
    </div>
    <div class="bar" style="margin-bottom:18px"><i style="width:${pct}%"></i></div>

    <div class="card">
      <div class="q-text">${formatQuestionText(q)}</div>
      ${q.questionType === "mcq" ? renderOptions(q, st, tempPick) : renderReorder(q, st, tempOrder)}
      <div id="prExplainWrap">${st ? renderExplanation(q, st) : ""}</div>
    </div>

    <div style="display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap">
      <button class="btn ghost" id="prPrev" ${practiceState.idx===0?"disabled":""}>‹ Câu trước</button>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        ${!st ? `<button class="btn" id="prSubmit">Kiểm tra</button>` : ``}
        <button class="btn soft" id="prNext">${practiceState.idx === total-1 ? "Xem kết quả" : "Câu tiếp ›"}</button>
      </div>
    </div>
  </div>`;
}

function formatQuestionText(q){
  if(q.questionType === "mcq"){
    return esc(q.question).replace(/_{3,}/g, "<u></u>");
  }
  return esc(q.question);
}

function renderOptions(q, st, tempPick){
  const correctKey = q.correctAnswer;
  const letters = ["A","B","C","D"];
  return q.options.map((opt, i)=>{
    const key = letters[i];
    let cls = "opt";
    if(st){
      cls += " locked";
      if(key === correctKey) cls += " correct";
      else if(st.picked === key) cls += " wrong";
    } else if(tempPick === key){
      cls += " selected";
    }
    return `<button class="${cls}" data-opt="${key}" ${st ? "disabled" : ""}>
      <span class="key">${key}</span><span>${esc(opt)}</span>
    </button>`;
  }).join("");
}

function renderReorder(q, st, tempOrder){
  const order = st && st.order ? st.order : (tempOrder || []);
  const pool = q.originalWords.map((_,i)=>i).filter(i=>!order.includes(i));
  return `
    <div class="reorder-label">Câu trả lời của bạn</div>
    <div class="answer-area" id="prAnswer">
      ${order.length ? order.map(i=>`<span class="chip in-answer" data-remove="${i}">${esc(q.originalWords[i])}</span>`).join("")
                      : `<span style="color:var(--muted);font-size:13px">Nhấn vào các từ bên dưới để thêm vào câu…</span>`}
    </div>
    <div class="reorder-label" style="margin-top:14px">Các từ / cụm từ</div>
    <div class="pool" id="prPool">
      ${pool.map(i=>`<span class="chip" data-add="${i}">${esc(q.originalWords[i])}</span>`).join("")}
    </div>
    ${!st ? `<div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        <button class="btn ghost sm" data-undo="1">↶ Undo</button>
        <button class="btn ghost sm" data-clear="1">✕ Clear</button>
      </div>` : ``}
  `;
}

function renderExplanation(q, st){
  const ok = st.correct;
  let html = `<div class="explain ${ok ? "good" : "bad"}">`;
  html += `<h5>${ok ? "✓ Chính xác!" : "✗ Chưa đúng"}</h5>`;
  if(q.questionType === "mcq"){
    const letters = ["A","B","C","D"];
    const correctText = q.options[letters.indexOf(q.correctAnswer)];
    html += `<div><b>Đáp án đúng: ${q.correctAnswer}.</b> ${esc(correctText)}</div>`;
  } else {
    html += `<div><b>Đáp án đúng:</b> ${esc(q.correctSentence)}</div>`;
  }
  html += `<div style="margin-top:8px">${esc(q.explanation)}</div>`;
  if(q.vietnameseTranslation) html += `<div class="vi">→ ${esc(q.vietnameseTranslation)}</div>`;
  html += `</div>`;
  return html;
}

function bindQuestionUI(pState){
  const q = pState.list[pState.idx];
  const st = pState.answers[q.id];
  const v = document.getElementById("view");

  if(q.questionType === "mcq" && !st){
    v.querySelectorAll("[data-opt]").forEach(b=>{
      b.addEventListener("click", ()=>{
        v.querySelectorAll("[data-opt]").forEach(x=>x.classList.remove("selected"));
        b.classList.add("selected");
        pState._tempPicks[q.id] = b.getAttribute("data-opt");
      });
    });
  }

  if(q.questionType === "reorder" && !st){
    if(!pState._tempOrders[q.id]) pState._tempOrders[q.id] = [];

    const sync = ()=>{
      const order = pState._tempOrders[q.id];
      const answerArea = document.getElementById("prAnswer");
      const pool = document.getElementById("prPool");
      if(answerArea){
        answerArea.innerHTML = order.length
          ? order.map(i=>`<span class="chip in-answer" data-remove="${i}">${esc(q.originalWords[i])}</span>`).join("")
          : `<span style="color:var(--muted);font-size:13px">Nhấn vào các từ bên dưới để thêm vào câu…</span>`;
      }
      if(pool){
        const rest = q.originalWords.map((_,i)=>i).filter(i=>!order.includes(i));
        pool.innerHTML = rest.map(i=>`<span class="chip" data-add="${i}">${esc(q.originalWords[i])}</span>`).join("");
      }
      attach();
    };
    const attach = ()=>{
      const answerArea = document.getElementById("prAnswer");
      const pool = document.getElementById("prPool");
      if(pool) pool.querySelectorAll("[data-add]").forEach(c=>{
        c.addEventListener("click", ()=>{
          const i = Number(c.getAttribute("data-add"));
          pState._tempOrders[q.id].push(i);
          sync();
        });
      });
      if(answerArea) answerArea.querySelectorAll("[data-remove]").forEach(c=>{
        c.addEventListener("click", ()=>{
          const i = Number(c.getAttribute("data-remove"));
          pState._tempOrders[q.id] = pState._tempOrders[q.id].filter(x=>x !== i);
          sync();
        });
      });
    };
    attach();

    const undo = v.querySelector("[data-undo]");
    if(undo) undo.addEventListener("click", ()=>{
      pState._tempOrders[q.id].pop(); sync();
    });
    const clr = v.querySelector("[data-clear]");
    if(clr) clr.addEventListener("click", ()=>{
      pState._tempOrders[q.id] = []; sync();
    });
  }
}

function submitPracticeAnswer(){
  const pState = practiceState;
  if(!pState) return;
  const q = pState.list[pState.idx];
  if(pState.answers[q.id]) return;

  let picked = null, order = null, correct = false;

  if(q.questionType === "mcq"){
    picked = pState._tempPicks[q.id] || null;
    if(!picked){ toast("Vui lòng chọn một đáp án."); return; }
    correct = picked === q.correctAnswer;
  } else {
    order = (pState._tempOrders[q.id]) ? pState._tempOrders[q.id].slice() : [];
    if(order.length !== q.originalWords.length){ toast("Hãy sắp xếp tất cả các từ trước khi kiểm tra."); return; }
    correct = order.every((val, i)=> val === q.correctOrder[i]);
  }

  pState.answers[q.id] = { picked, order, correct };
  if(!correct) pState.wrongIds.push(q.id);
  recordAnswer(q.id, correct);
  render();
}

function finishPractice(){
  if(!practiceState) return;
  const pState = practiceState;
  const total = pState.list.length;
  let correct = 0, wrong = 0;
  pState.list.forEach(q=>{
    const a = pState.answers[q.id];
    if(!a) return;
    if(a.correct) correct++; else wrong++;
  });
  const unanswered = total - correct - wrong;
  const answered = correct + wrong;
  const accuracy = answered ? Math.round(correct / answered * 100) : 0;
  const duration = Math.round((Date.now() - pState.startedAt)/1000);

  pState.results = { total, correct, wrong, unanswered, answered, accuracy, duration };
  pState.finished = true;

  state.sessions.push({
    date: new Date().toISOString(),
    type: "practice",
    mode: pState.mode,
    unit: pState.unitId || null,
    total, correct, wrong, unanswered, accuracy, duration
  });
  saveState(true);
  render();
}

      <button class="btn ghost" id="prRetryAll">Làm lại toàn bộ</button>

    ${wrongQs.length ? `

      ${wrongQs.map(q=>`

    ${unattempted.length ? `

    </div>` : ""}
  </div>`;
}
