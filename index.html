function startTest(){
  let pool;
  if(testCfg.type === "full") pool = Q.slice();
  else pool = Q.filter(q=>q.part === testCfg.type);

  if(!pool.length){ toast("Không có câu hỏi phù hợp."); return; }

  let list = shuffle(pool);
  const n = Math.min(testCfg.count, list.length);
  list = list.slice(0, n);

  const typeLabel = testCfg.type === "full" ? "Full Test" :
                    testCfg.type === "A" ? "Vocabulary Test (Part A)" :
                    testCfg.type === "B" ? "Grammar Test (Part B)" : "Reordering Test (Part C)";

  testState = {
    type: testCfg.type,
    typeLabel,
    list,
    idx: 0,
    answers: {},
    startedAt: Date.now(),
    finished: false,
    _tempPicks: {},
    _tempOrders: {}
  };
  render();
  window.scrollTo({top:0});
}

    <div class="bar" style="margin-bottom:18px"><i style="width:${Math.round(answered/total*100)}%"></i></div>

    <div class="card">
      <div class="q-text">${formatQuestionText(q)}</div>
      ${q.questionType === "mcq" ? renderOptions(q, null, tempPick) : renderReorder(q, null, tempOrder)}
    </div>

    <div style="display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap">
      <button class="btn ghost" id="tsPrev" ${testState.idx===0?"disabled":""}>‹ Câu trước</button>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn" id="tsSubmit">Lưu câu trả lời</button>
        <button class="btn soft" id="tsNext" ${testState.idx === total-1 ? "disabled" : ""}>Câu tiếp ›</button>
        <button class="btn green" id="tsFinish">Nộp bài</button>

  </div>`;
}

function submitTestAnswer(){
  const ts = testState;
  if(!ts) return;
  const q = ts.list[ts.idx];

  if(q.questionType === "mcq"){
    const pick = ts._tempPicks[q.id];
    if(!pick){ toast("Vui lòng chọn một đáp án."); return; }
    ts.answers[q.id] = { picked: pick, correct: pick === q.correctAnswer };
  } else {
    const order = (ts._tempOrders[q.id]) ? ts._tempOrders[q.id].slice() : [];
    if(order.length !== q.originalWords.length){ toast("Hãy sắp xếp tất cả các từ."); return; }
    const ok = order.every((val, i)=> val === q.correctOrder[i]);
    ts.answers[q.id] = { order, correct: ok };
  }
  render();
  toast("Đã lưu câu trả lời");
}

function confirmSubmitTest(){
  const ts = testState;
  if(!ts) return;
  const unanswered = ts.list.length - Object.keys(ts.answers).length;
  modal({
    title: "Nộp bài kiểm tra?",
    message: unanswered > 0
      ? `Bạn còn <b>${unanswered}</b> câu chưa trả lời. Câu chưa trả lời sẽ được tính là <b>sai</b>. Bạn có chắc muốn nộp bài?`
      : "Bạn đã trả lời tất cả các câu. Nộp bài để xem kết quả?",
    okText: "Nộp bài",
    cancelText: "Tiếp tục làm",
    onOk: finishTest
  });
}

function finishTest(){
  const ts = testState;
  if(!ts) return;
  const total = ts.list.length;
  let correct = 0, wrong = 0;

  ts.list.forEach(q=>{
    const a = ts.answers[q.id];
    const ok = a ? a.correct : false;
    if(ok) correct++; else wrong++;
    recordAnswer(q.id, ok);
  });

  const duration = Math.round((Date.now() - ts.startedAt)/1000);
  const accuracy = total ? Math.round(correct / total * 100) : 0;

  ts.results = { total, correct, wrong, unanswered: total - correct - wrong, accuracy, duration };
  ts.finished = true;

  const record = {
    date: new Date().toISOString(),
    typeLabel: ts.typeLabel,
    type: ts.type,
    total, correct, wrong,
    accuracy, duration
  };
  state.tests.push(record);
  state.sessions.push({
    date: record.date, type: "test", mode: ts.type,
    total, correct, wrong, accuracy, duration
  });
  saveState(true);
  render();
  window.scrollTo({top:0});
}

function afterSettings(){
  const s = state.settings;

  const bind = (id, key, isNum)=>{
    const el = document.getElementById(id);
    if(!el) return;
    el.addEventListener("change", ()=>{
      if(el.type === "checkbox") s[key] = el.checked;
      else s[key] = isNum ? Number(el.value) : el.value;
      saveState();
      toast("Đã lưu cài đặt");
    });
  };
  bind("setAudio","audio");
  bind("setTts","tts");
  bind("setRate","rate", true);
  bind("setAnim","animation");
  bind("setShuffleQ","shuffleQuestions");

  const exp = document.getElementById("setExport");
  if(exp) exp.addEventListener("click", exportProgress);

  const impBtn = document.getElementById("setImport");
  const impFile = document.getElementById("setImportFile");
  if(impBtn && impFile){
    impBtn.addEventListener("click", ()=> impFile.click());
    impFile.addEventListener("change", ()=>{
      const f = impFile.files && impFile.files[0];
      if(!f) return;
      const reader = new FileReader();
      reader.onload = ()=>{
        try{
          const data = JSON.parse(reader.result);
          if(!data || typeof data !== "object") throw new Error("bad");
          const ok = data.vocab || data.questions || data.tests || data.sessions || data.settings;
          if(!ok) throw new Error("bad");
          modal({
            title:"Nhập dữ liệu học tập?",
            message:"Dữ liệu hiện tại sẽ được thay thế bằng dữ liệu trong file JSON. Bạn có chắc chắn?",
            okText:"Nhập dữ liệu",
            cancelText:"Hủy",
            onOk: ()=>{
              const fresh = JSON.parse(JSON.stringify(DEFAULT_STATE));
              if(data.vocab && typeof data.vocab === "object") fresh.vocab = data.vocab;
              if(data.questions && typeof data.questions === "object") fresh.questions = data.questions;
              if(Array.isArray(data.tests)) fresh.tests = data.tests;
              if(Array.isArray(data.sessions)) fresh.sessions = data.sessions;
              if(data.settings && typeof data.settings === "object"){
                Object.keys(DEFAULT_STATE.settings).forEach(k=>{
                  if(typeof data.settings[k] !== "undefined") fresh.settings[k] = data.settings[k];
                });
              }
              state = fresh;
              saveState(true);
              toast("Đã nhập dữ liệu thành công");
              render();
            }
          });
        }catch(e){
          toast("File JSON không hợp lệ.");
        }
        impFile.value = "";
      };
      reader.readAsText(f);
    });
  }

  const reset = document.getElementById("setReset");
  if(reset) reset.addEventListener("click", ()=>{
    modal({
      title:"Xóa toàn bộ tiến độ?",
      message:"Toàn bộ trạng thái từ vựng, kết quả luyện tập và lịch sử kiểm tra sẽ bị xóa vĩnh viễn. Từ vựng và câu hỏi gốc vẫn được giữ nguyên.",
      okText:"Xóa tiến độ",
      cancelText:"Hủy",
      danger:true,
      onOk: ()=>{
        state.vocab = {};
        state.questions = {};
        state.tests = [];
        state.sessions = [];
        saveState(true);
        toast("Đã xóa toàn bộ tiến độ");
        render();
      }
    });
  });
}

function exportProgress(){
  const data = {
    app: "English for Secretaries – Vocabulary Learning App",
    exportedAt: new Date().toISOString(),
    vocabCount: VOCAB.length,
    questionCount: Q.length,
    vocab: state.vocab,
    questions: state.questions,
    tests: state.tests,
    sessions: state.sessions,
    settings: state.settings
  };
  try{
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "english-for-secretaries-progress-" + todayISO() + ".json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
    toast("Đã xuất file tiến độ");
  }catch(e){
    toast("Không thể xuất file trên thiết bị này.");
  }
}

/* ================================================================
   16. KEYBOARD + GLOBAL EVENTS
   ================================================================ */
document.addEventListener("keydown", (e)=>{
  if(e.target.matches("input, select, textarea")) return;
  if(e.code === "Space" && fcState && !fcState.finished && currentView === "flashcards"){
    e.preventDefault();
    flipCard();
  }
  if(e.key === "ArrowRight" && fcState && !fcState.finished && currentView === "flashcards"){
    nextCard();
  }
  if(e.key === "ArrowLeft" && fcState && !fcState.finished && currentView === "flashcards"){
    if(fcState.idx > 0){ fcState.idx--; fcState.flipped = false; render(); }
  }
});

document.getElementById("hamburger").addEventListener("click", ()=>{
  const sb = document.getElementById("sidebar");
  if(sb.classList.contains("open")) closeSidebar(); else openSidebar();
});
document.getElementById("overlay").addEventListener("click", closeSidebar);

window.addEventListener("resize", ()=>{
  if(window.innerWidth > 860) closeSidebar();
});

/* ================================================================
   17. BOOT
   ================================================================ */
(function init(){
  if(VOCAB.length !== 89) console.warn("Số lượng từ vựng không phải 89:", VOCAB.length);
  if(Q.length !== 100) console.warn("Số lượng câu hỏi không phải 100:", Q.length);
  const missingAns = Q.filter(q=>!q.explanation || (!q.correctAnswer && q.questionType === "mcq"));
  if(missingAns.length) console.warn("Một số câu thiếu đáp án/giải thích:", missingAns.map(q=>q.id));

  buildNav();
  navigate("dashboard");

  if("speechSynthesis" in window){
    setTimeout(()=>{ try{ window.speechSynthesis.getVoices(); }catch(e){} }, 400);
  }
})();
</script>
